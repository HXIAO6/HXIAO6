name: Generate Snake

on:
  schedule:
    - cron: "0 21 * * *" # 每天 UTC 21:00 → 北京时间 05:00
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: HXIAO6
          outputs: |
            dist/snake.svg?color_snake=#0891B2&color_dots=#EBEDF0,#BAE6F5,#67D3E8,#22A8C8,#0E7490
            dist/snake-dark.svg?palette=github-dark&color_snake=#22D3EE&color_dots=#0B1526,#123155,#1D4ED8,#818CF8,#22D3EE

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
