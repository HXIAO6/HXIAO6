    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#DCE6F5" stroke-width="1"/>
    </pattern>
    <clipPath id="wipe"><rect x="0" y="0" width="0" height="380">
      <animate attributeName="width" from="0" to="1200" begin="0.3s" dur="1.3s" fill="freeze" calcMode="spline" keySplines="0.22 0.61 0.36 1"/>
    </rect></clipPath>
    <clipPath id="track"><rect x="72" y="336" width="1056" height="4"/></clipPath>
  </defs>

  <rect width="1200" height="380" fill="url(#bg)"/>

  <g>
    <ellipse cx="300" cy="40" rx="380" ry="200" fill="url(#aur1)">
      <animateTransform attributeName="transform" type="translate" values="0 0;70 26;-24 12;0 0" dur="19s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.75;1;0.7;0.75" dur="13s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="980" cy="300" rx="340" ry="190" fill="url(#aur2)">
      <animateTransform attributeName="transform" type="translate" values="0 0;-54 -18;20 -6;0 0" dur="23s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.95;0.55;0.6" dur="17s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="700" cy="-30" rx="300" ry="160" fill="url(#aur3)">
      <animateTransform attributeName="transform" type="translate" values="0 0;40 20;-30 8;0 0" dur="27s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <rect width="1200" height="380" fill="url(#grid)" opacity="0.55"/>

  <g clip-path="url(#wipe)">
    <text x="72" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="13" letter-spacing="5.5" fill="#93A5BE">SHANGHAI UNIVERSITY · CS · M.SC 2026</text>

    <text x="66" y="200" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
          font-size="82" font-weight="800" letter-spacing="1" fill="url(#nameG)">HXIAO6</text>

    <text x="72" y="246" font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif"
          font-size="22" font-weight="600" letter-spacing="3.4" fill="url(#acc)">AGENT · RAG · LLM</text>

    <text x="72" y="282" font-family="ui-sans-serif, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif"
          font-size="15" fill="#5A6B85">万神 ／ 智能体安全 · 可验证、可复现、可交付</text>
  </g>

  <g opacity="0">
