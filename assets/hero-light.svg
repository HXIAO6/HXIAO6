    <circle cx="76" cy="304" r="4" fill="#059669"/>
    <circle cx="76" cy="304" r="4" fill="none" stroke="#059669" stroke-width="1">
      <animate attributeName="r" values="4;13" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;0" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <text x="94" y="309" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="12" letter-spacing="2.4" fill="#93A5BE">STATUS · EXPLORING</text>
  </g>

  <g stroke="url(#acc)" stroke-width="1.5" fill="none" opacity="0.85" stroke-dasharray="7 11">
    <path d="M812 186 L906 112"><animate attributeName="stroke-dashoffset" from="0" to="-72" dur="2.8s" repeatCount="indefinite"/></path>
    <path d="M812 186 L922 206"><animate attributeName="stroke-dashoffset" from="0" to="-72" dur="3.4s" repeatCount="indefinite"/></path>
    <path d="M906 112 L1014 138"><animate attributeName="stroke-dashoffset" from="0" to="-72" dur="2.2s" repeatCount="indefinite"/></path>
    <path d="M922 206 L1014 138"><animate attributeName="stroke-dashoffset" from="0" to="-72" dur="3.1s" repeatCount="indefinite"/></path>
    <path d="M922 206 L1006 282"><animate attributeName="stroke-dashoffset" from="0" to="-72" dur="2.5s" repeatCount="indefinite"/></path>
    <path d="M1014 138 L1092 214"><animate attributeName="stroke-dashoffset" from="0" to="-72" dur="2.9s" repeatCount="indefinite"/></path>
    <path d="M1006 282 L1092 214"><animate attributeName="stroke-dashoffset" from="0" to="-72" dur="3.6s" repeatCount="indefinite"/></path>
  </g>

  <g>
    <circle cx="812" cy="186" r="8" fill="#0891B2"/>
    <circle cx="812" cy="186" r="8" fill="none" stroke="#0891B2" stroke-width="1.2">
      <animate attributeName="r" values="8;26" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="906" cy="112" r="5" fill="#22D3EE"/>
    <circle cx="922" cy="206" r="5" fill="#818CF8"/>
    <circle cx="1014" cy="138" r="11" fill="#6366F1"/>
    <circle cx="1014" cy="138" r="11" fill="none" stroke="#6366F1" stroke-width="1.2">
      <animate attributeName="r" values="11;30" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.75;0" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1006" cy="282" r="5" fill="#22D3EE"/>
    <circle cx="1092" cy="214" r="7" fill="#0891B2"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#8FA0B8" letter-spacing="1.4">
    <text x="826" y="178">query</text>
    <text x="1022" y="128">retrieve</text>
    <text x="944" y="296">rerank</text>
    <text x="1100" y="236">answer</text>
  </g>

  <rect x="72" y="336" width="1056" height="2" fill="#E2E9F6" rx="1"/>
  <g clip-path="url(#track)">
    <rect x="-220" y="336" width="220" height="2" fill="url(#acc)">
      <animate attributeName="x" values="-220;1200" dur="5.5s" repeatCount="indefinite"/>
    </rect>
