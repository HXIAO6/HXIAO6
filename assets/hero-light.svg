<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="HXIAO6">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F1F5FF"/>
    </linearGradient>
    <radialGradient id="aur1"><stop offset="0" stop-color="#BFDBFE" stop-opacity="0.85"/><stop offset="1" stop-color="#BFDBFE" stop-opacity="0"/></radialGradient>
    <radialGradient id="aur2"><stop offset="0" stop-color="#A5F3FC" stop-opacity="0.8"/><stop offset="1" stop-color="#A5F3FC" stop-opacity="0"/></radialGradient>
    <radialGradient id="aur3"><stop offset="0" stop-color="#DDD6FE" stop-opacity="0.8"/><stop offset="1" stop-color="#DDD6FE" stop-opacity="0"/></radialGradient>
    <linearGradient id="nameG" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0891B2"/>
      <stop offset="1" stop-color="#6366F1"/>
